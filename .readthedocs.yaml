version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt

# Mounts the AstroPTv3 docs corpus (README/PLAN/EXPERIMENTS/guides/ADRs)
# into this site: docs/source/conf.py copies it out of the submodule at
# build time. AstroPTv3's repository is the single source of truth.
submodules:
  include: all
  recursive: true
